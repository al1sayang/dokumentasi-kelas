<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Kegiatan - TJKT Archive</title>

    <!-- SCRIPT TEMA OTOMATIS (MENCEGAH KEDIPAN SAAT HALAMAN DILOAD) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>

    <!-- Import Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Latar Belakang Default (Dark Mode) */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- MENU NAVIGASI --- */
        nav {
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .logo {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
            transition: color 0.4s ease;
        }

        .logo span {
            color: #3b82f6;
        }

        .nav-links {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #60a5fa;
        }

        /* --- STYLING TOMBOL SWITCH TEMA --- */
        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #f1f5f9;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle-btn:hover {
            background: #3b82f6;
            color: #ffffff;
            transform: scale(1.08);
        }

        /* --- CONTAINER UTAMA --- */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 18px 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        /* --- CONTAINER KARTU KELAS --- */
        .class-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* --- KARTU KELAS DENGAN ANIMASI TEKAN (CLICK) --- */
        .class-card {
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 2.2rem;
            font-weight: 700;
            display: block;
            position: relative;
            overflow: hidden;
            user-select: none;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.3s ease, 
                        background 0.3s ease;
        }

        /* ANIMASI SAAT KARTU DIPENCET / DIKLIK (ACTIVE) */
        .class-card:active {
            transform: scale(0.96) translateY(2px) !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1) !important;
        }

        /* 1. KELAS X - Soft Ice Blue */
        .class-card.kelas-x {
            background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
            color: #e0f2fe;
            border: 2px solid #38bdf8;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
        }

        .class-card.kelas-x:hover {
            transform: translateY(-5px);
            background: linear-gradient(135deg, #2563eb 0%, #0369a1 100%);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.35);
        }

        /* 2. KELAS XI - Soft Mint Green */
        .class-card.kelas-xi {
            background: linear-gradient(135deg, #064e3b 0%, #059669 100%);
            color: #d1fae5;
            border: 2px solid #34d399;
            box-shadow: 0 8px 20px rgba(52, 211, 153, 0.2);
        }

        .class-card.kelas-xi:hover {
            transform: translateY(-5px);
            background: linear-gradient(135deg, #047857 0%, #10b981 100%);
            box-shadow: 0 15px 30px rgba(52, 211, 153, 0.35);
        }

        /* 3. KELAS XII - Soft Lavender Purple */
        .class-card.kelas-xii {
            background: linear-gradient(135deg, #581c87 0%, #7e22ce 100%);
            color: #f3e8ff;
            border: 2px solid #c084fc;
            box-shadow: 0 8px 20px rgba(192, 132, 252, 0.2);
        }

        .class-card.kelas-xii:hover {
            transform: translateY(-5px);
            background: linear-gradient(135deg, #6b21a8 0%, #9333ea 100%);
            box-shadow: 0 15px 30px rgba(192, 132, 252, 0.35);
        }

        /* EFEK GELOMBANG (RIPPLE EFFECT) SAAT DIKLIK */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 25px;
            background-color: rgba(15, 23, 42, 0.95);
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 60px;
            border-top: 1px solid rgba(255,255,255,0.05);
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* =========================================================
           TEMA LIGHT MODE (TAMPILAN TERANG)
           ========================================================= */
        html.light-mode body, body.light-mode {
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #f1f5f9 100%);
            color: #1e293b;
        }

        html.light-mode nav, body.light-mode nav {
            background-color: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        html.light-mode .logo, body.light-mode .logo {
            color: #0f172a;
        }

        html.light-mode .nav-links a, body.light-mode .nav-links a {
            color: #475569;
        }

        html.light-mode .nav-links a:hover, 
        html.light-mode .nav-links a.active,
        body.light-mode .nav-links a:hover, 
        body.light-mode .nav-links a.active {
            color: #2563eb;
        }

        html.light-mode .theme-toggle-btn, body.light-mode .theme-toggle-btn {
            background: rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(15, 23, 42, 0.2);
            color: #0f172a;
        }

        html.light-mode .page-title, body.light-mode .page-title {
            background: #ffffff;
            color: #0f172a;
            border-color: #e2e8f0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
        }

        /* Kartu Kelas Warna Pastel Halus di Light Mode */
        html.light-mode .class-card.kelas-x, body.light-mode .class-card.kelas-x {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            color: #0369a1;
            border-color: #93c5fd;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15);
        }

        html.light-mode .class-card.kelas-xi, body.light-mode .class-card.kelas-xi {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #047857;
            border-color: #6ee7b7;
            box-shadow: 0 8px 20px rgba(52, 211, 153, 0.15);
        }

        html.light-mode .class-card.kelas-xii, body.light-mode .class-card.kelas-xii {
            background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
            color: #6b21a8;
            border-color: #c084fc;
            box-shadow: 0 8px 20px rgba(192, 132, 252, 0.15);
        }

        html.light-mode footer, body.light-mode footer {
            background-color: rgba(255, 255, 255, 0.95);
            color: #64748b;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body>

    <!-- MENU NAVIGASI -->
    <nav>
        <div class="logo">TJKT <span>ARCHIVE</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="kegiatan.html" class="active">Informasi Kegiatan</a></li>
            <li><a href="anggota.html">Anggota</a></li>
            <!-- TOMBOL SWITCH DARK / LIGHT MODE -->
            <li>
                <button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Ubah Mode Tampilan">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Pilih Jenjang Kelas</h1>

        <!-- KARTU PILIHAN KELAS -->
        <div class="class-container">
            <a href="kelas-x.html" class="class-card kelas-x">
                KELAS X
            </a>
            
            <a href="kelas-xi.html" class="class-card kelas-xi">
                KELAS XI
            </a>
            
            <a href="kelas-xii.html" class="class-card kelas-xii">
                KELAS XII
            </a>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 TJKT Archive. All Rights Reserved.</p>
    </footer>

    <!-- SCRIPT UNTUK EFEK GELOMBANG (RIPPLE) & SWITCH TEMA -->
    <script>
        // Efek Ripple Saat Kartu Diklik
        document.querySelectorAll('.class-card').forEach(card => {
            card.addEventListener('click', function (e) {
                let x = e.clientX - e.target.getBoundingClientRect().left;
                let y = e.clientY - e.target.getBoundingClientRect().top;

                let ripples = document.createElement('span');
                ripples.classList.add('ripple');
                ripples.style.left = x + 'px';
                ripples.style.top = y + 'px';
                this.appendChild(ripples);

                setTimeout(() => {
                    ripples.remove();
                }, 600);
            });
        });

        // Script Switch Dark / Light Mode Permanen
        function toggleTheme() {
            const html = document.documentElement;
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            
            html.classList.toggle('light-mode');
            body.classList.toggle('light-mode');

            if (html.classList.contains('light-mode')) {
                if (themeIcon) {
                    themeIcon.className = 'fa-solid fa-sun';
                    themeIcon.style.color = '#f59e0b';
                }
                localStorage.setItem('theme', 'light');
            } else {
                if (themeIcon) {
                    themeIcon.className = 'fa-solid fa-moon';
                    themeIcon.style.color = '#f1f5f9';
                }
                localStorage.setItem('theme', 'dark');
            }
        }

        // Sinkronisasi Ikon Setelah Halaman Selesai Dimuat
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const themeIcon = document.getElementById('themeIcon');

            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-mode');
                document.body.classList.add('light-mode');
                if (themeIcon) {
                    themeIcon.className = 'fa-solid fa-sun';
                    themeIcon.style.color = '#f59e0b';
                }
            } else {
                if (themeIcon) {
                    themeIcon.className = 'fa-solid fa-moon';
                    themeIcon.style.color = '#f1f5f9';
                }
            }
        });
    </script>

</body>
</html>
